comment: >-
  Displays a hero banner, typically placed at the top of the page. The hero
  supports a heading, featured illustration, and navigation links. You can
  also add a background image with an overlay to improve contrast.
arguments:
  heading-level:
    type: int
    optional: true
    release: v2.4.0
    comment: >-
      Heading level of the hero title, from 1 (h1) to 6 (h6). Set 0 to render a
      div instead of a heading.
  page:
  breadcrumb:
  heading:
  background:
  illustration:
  link-type:
  links:
  align:
  order:
  overlay-mode:
  cover:
  orientation:
  justify:
  use-section:
  use-title:
  size:
  class:
  width:
    default: 8
  fluid:
  theme:
  raw:
  hook:
    default: assets/hero-image.html
  heading-style:
  content-style:
