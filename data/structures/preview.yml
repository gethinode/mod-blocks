comment: >-
  Renders a live URL preview with switchable device views (desktop, tablet, mobile).
arguments:
  page:
    optional: true
    comment: >-
      Owning page of the preview, used to render the fallback image in the
      correct page context. Falls back to the global page context when omitted.
  url:
    optional: true
  device:
    optional: true
  controls-placement:
    optional: true
  desktop-responsive:
    optional: true
  heading:
    optional: true
  image:
    optional: true
  mode:
    optional: true
  show-fallback:
    optional: true
