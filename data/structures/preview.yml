comment: >-
  Renders a live URL preview with switchable device views (desktop, tablet, mobile).
arguments:
  heading-level:
    type: int
    optional: true
    release: v2.4.0
    comment: >-
      Heading level of the section title, from 1 (h1) to 6 (h6). Set 0 to render
      a div instead of a heading.
  page:
    optional: true
    comment: >-
      Owning page of the preview, used to render the fallback image in the
      correct page context. Falls back to the global page context when omitted.
  url:
    optional: true
  device:
    optional: true
  controls-placement:
    optional: true
  desktop-responsive:
    optional: true
  heading:
    optional: true
  image:
    optional: true
  mode:
    optional: true
  show-fallback:
    optional: true
