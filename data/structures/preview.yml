comment: >-
  Renders a live URL preview with switchable device views (desktop, tablet, mobile).
arguments:
  heading-level:
    release: v2.4.0
  page:
    optional: true
    comment: >-
      Owning page of the preview, used to render the fallback image in the
      correct page context. Falls back to the global page context when omitted.
  url:
    optional: true
  device:
    optional: true
  devices:
    type: slice
    optional: true
    default: [desktop, tablet, mobile]
    comment: >-
      Device views to offer, in the order the views and their buttons render.
      Each entry is one of desktop, tablet or mobile, and the list must not be
      empty. A repeated entry is dropped with a warning. When device names a
      view that is not offered, the first offered view is shown instead.
    options:
      values:
        - desktop
        - tablet
        - mobile
  controls:
    type: bool
    optional: true
    default: true
    comment: >-
      Flag indicating if the device switcher renders. Without it, the block
      shows the largest offered device that fits the viewport, or the smallest
      offered device when none fits, and swaps views when the viewport crosses
      a device breakpoint.
  controls-placement:
    optional: true
  desktop-responsive:
    optional: true
  heading:
    optional: true
  image:
    optional: true
  mode:
    optional: true
  show-fallback:
    optional: true
