comment: >-
  Renders a bookshop component as section, using common styling options such as
  background, width, and justification.
group: partial
arguments:
  _ordinal:
  id:
  page:
    optional: true
    comment: >-
      Owning page of the section, used to resolve page-level settings such as
      the overlay mode. Falls back to the global page context when omitted.
  embed:
    type: bool
    optional: true
    comment: >-
      Flag to indicate the section is embedded within another element such as a
      documentation page. Defaults to false when omitted.
  component-name:
    type: string
    optional: false
    comment: >-
      Name of the bookshop component, excluding its path relative to the
      bookshop folder.
  raw:
  passthrough:
  padding:
    type: int
    optional: true
    default:
    comment: >-
      Overrides the section's vertical padding, replacing the site-wide `y`
      value from the `padding` configuration. Accepts 0 through 5. Horizontal
      padding is unaffected: it is the page gutter, shared by every section.
      Falls back to the site setting when omitted. The empty `default:` above is
      load-bearing: it overrides the `default: 3` this argument would otherwise
      inherit from the shared definition in mod-utils, which would make an
      omitted value indistinguishable from a supplied one and repad every
      section. The inherited 0-5 range still applies.
  background:
  width:
    default: 12
  justify:
  wrapper:
  fluid:
  theme:
  cover:
    default: false
  overlay-mode:
  section-class:
  bg-class:
