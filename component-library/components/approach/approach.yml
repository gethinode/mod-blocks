comment: >-
  Renders an Approach section with heading and a list of elements with icons.
  Set 'layout: split' for a heading-left, stacked-list-right layout, and
  'numbered: true' to render each element's marker in a tinted circle
  (per-element image is always ignored). A numbered element's own 'icon' wins
  when set; otherwise it falls back to a bare digit resolved through the
  site's configured fontawesome.defaultFamily (Font Awesome Solid by
  default) — that fallback only shows a glyph when the resolved family ships
  plain digit names, so families like Bootstrap Icons' 'bi' need an explicit
  element icon such as '1-circle'. Both arguments default to the existing
  card grid.
arguments:
  heading-level:
    type: int
    optional: true
    release: v2.4.0
    comment: >-
      Heading level of the section title, from 1 (h1) to 6 (h6). Set 0 to render a
      div instead of a heading. Defaults to the level the page assigns: the first
      titled block of a page without a page header becomes its h1, the rest become
      h2.
  numbered:
    type: bool
    optional: true
example: |
  heading:
    title: Our Approach
  layout: split
  numbered: true
  elements:
    - title: Research
      icon: search
      content: We start with thorough research and discovery.
    - title: Design
      icon: draw
      content: We create clean, modern designs tailored to your needs.
    - title: Deliver
      content: We ship high-quality results on time (falls back to a digit).
