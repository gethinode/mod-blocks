comment: >-
  Renders a grid of cards with icons, titles, and descriptions. Each element
  accepts an optional subtitle and highlight, rendered as inline markdown
  between the title and the description. Set align_rows with a stacked
  orientation to line up the titles, subtitles, highlights, descriptions and
  buttons of the cards in each row.
example: |
  heading:
    title: Our Services
  cols: 3
  orientation: stacked
  align_rows: true
  elements:
    - title: Service One
      icon: star
      subtitle: For individuals.
      highlight: "**€0** per month"
      content: Description of service one.
    - title: Service Two
      icon: bolt
      subtitle: For growing teams that need shared workspaces.
      highlight: "**€149** per month"
      content: Description of service two.
    - title: Service Three
      icon: shield
      highlight: "**Custom pricing**"
      content: Description of service three.
