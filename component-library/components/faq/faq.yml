comment: >-
  Renders an FAQ accordion with heading and a list of question/answer items.
arguments:
  heading-level:
    type: int
    optional: true
    release: v2.4.0
    comment: >-
      Heading level of the section title, from 1 (h1) to 6 (h6). Set 0 to render a
      div instead of a heading. Defaults to the level the page assigns: the first
      titled block of a page without a page header becomes its h1, the rest become
      h2.
example: |
  heading:
    title: Frequently Asked Questions
  background:
    color: body-tertiary
  items:
    - title: What is Hinode?
      description: Hinode is a Hugo theme for documentation and blog sites built on Bootstrap 5.
    - title: How do I install it?
      description: Run npm install and then npm start to launch the development server.
