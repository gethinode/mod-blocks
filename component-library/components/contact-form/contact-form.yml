comment: >-
  Renders a contact form with an optional heading and custom form handler.
arguments:
  heading-level:
    type: int
    optional: true
    release: v2.4.0
    comment: >-
      Heading level of the section title, from 1 (h1) to 6 (h6). Set 0 to render a
      div instead of a heading. Defaults to the level the page assigns: the first
      titled block of a page without a page header becomes its h1, the rest become
      h2.
  hook:
    type: string
    optional: false
    comment: Render hook for the actual form.
  action:
    type: string
    optional: false
    comment: >-
      The form submission callback URL.
  form_id:
    type: string
    optional: true
    comment: >-
      The form's ID, which is used to retrieve the form definition.
example: |
  heading:
    preheading: Get in touch
    title: Contact Us
    content: We'd love to hear from you.
    align: center
  background:
    color: body-tertiary
  hook: assets/netlify-contact-form-hook.html
  action: /thank-you/
