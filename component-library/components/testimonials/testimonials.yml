comment: >-
  Renders a testimonials carousel with client quotes.
arguments:
  heading-level:
    type: int
    optional: true
    release: v2.4.0
    comment: >-
      Heading level of the section title, from 1 (h1) to 6 (h6). Set 0 to render a
      div instead of a heading. Defaults to the level the page assigns: the first
      titled block of a page without a page header becomes its h1, the rest become
      h2.
  testimonials:
    optional: false
example: |
  heading:
    title: What Our Clients Say
  testimonials:
    - content: Hinode is an excellent theme for building documentation sites.
      client:
        contact: Jane Doe
        url: https://example.com
    - content: Highly recommended for documentation and blog sites alike.
      client:
        contact: John Smith
        url: https://example.org
  cols: 1
  carousel: true
