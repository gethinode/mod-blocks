comment: >-
  Renders a live URL preview with switchable device views.
arguments:
  url:
    optional: true
  devices:
    type: slice
    optional: true
    default: [desktop, tablet, mobile]
    comment: >-
      Device views to offer, in the order the views and their buttons render.
      Each entry is one of desktop, tablet or mobile, and the list must not be
      empty. A repeated entry is dropped with a warning. When device names a
      view that is not offered, the first offered view becomes the default
      view instead.
    options:
      values:
        - desktop
        - tablet
        - mobile
  controls:
    type: bool
    optional: true
    default: true
    comment: >-
      Flag indicating if the device switcher renders. Without it, the block
      shows the largest offered device that fits the viewport, or the smallest
      offered device when none fits, and swaps views when the viewport crosses
      a device breakpoint.
  activation:
    type: select
    optional: true
    default: load
    comment: >-
      When the live view loads. With load, the shown view loads with the
      page. With click, every view shows its poster with a button over it, and
      no view loads until the button is pressed; after that, a view loads when
      it is first shown. A block that shows its fallback shows no poster.
    options:
      values:
        - load
        - click
  poster:
    type: map[string]interface {}
    optional: true
    comment: >-
      Poster image per device view, shown until the preview is activated when
      activation is click, except on a block that shows its fallback. The keys
      are desktop, tablet and mobile. A view without a poster of its own uses
      the desktop poster, or a plain background when there is none. The mode
      argument applies to posters too.
  items:
    type:
      - slice
      - '[]map[string]interface {}'
    optional: true
    comment: >-
      Views to switch between as tabs above the frame, each with a title and a
      url, both required, and an optional open-url, poster and heading. The
      first item shows first, and items replace url, with a warning when both
      are set. Switching tabs keeps the shown device, and once the block may
      load its views, loads the item url in the shown view only. open-url
      defaults to url. An item poster falls back from the view to the desktop
      poster of the item, then to the block poster. When an item has a
      heading, each tab shows the heading of its item, or the block heading
      when its item has none, in place of the block heading. A block that
      shows its fallback has no tabs and shows that heading of the first item
      only. The embedding checks run once per distinct item url, without its
      fragment, and the first url that cannot be framed shows the fallback,
      whose alert names that url. The views take the title of the shown item
      as their title.
  open-link:
    type: bool
    optional: true
    default: false
    comment: >-
      Flag indicating if a link that opens the shown view in a new tab renders
      under the frame. It points at the open-url of the shown item, else at its
      url, else at url. A block that shows its fallback renders no such link.
  links:
    optional: true
    comment: >-
      Links to render as buttons under the frame, centered.
  load-timeout:
    type: int
    optional: true
    default: 15
    comment: >-
      Seconds a view that the script loads may take before the view shows its
      poster again with an alert and a link that opens the shown item in a new
      tab. The time counts from when the frame first comes into view. Without
      ready-message, the load event of the frame ends the wait. Chrome fires
      that event for an error status and a refused connection too, so it
      catches a target that does not answer, not one that answers with an
      error; a target whose headers refuse framing is caught when the site
      builds. The view that loads with the page gets no deadline without
      ready-message. A value that is not positive counts as 15.
  ready-message:
    type: string
    optional: true
    default: ""
    comment: >-
      Message that the framed page posts to this page when it is ready. When
      set, a view stays busy behind its poster, with a waiting status and a
      frame that cannot take focus, until the window of its current frame
      posts exactly this string, or until load-timeout passes. The script posts
      the same string to the frame when it loads, and when the script starts
      for a frame that loaded with the page, so a page that announced itself
      before the script listened can answer. A late answer still shows the
      view. Showing another item, or a view for the first time, starts a new
      wait. Leave it empty to end the wait on the load event of the frame.
example: |
  heading:
    title: Live Preview
  url: https://demo.gethinode.com
  device: desktop
