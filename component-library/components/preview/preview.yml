comment: >-
  Renders a live URL preview with switchable device views.
arguments:
  url:
    optional: false
  devices:
    type: slice
    optional: true
    default: [desktop, tablet, mobile]
    comment: >-
      Device views to offer, in the order the views and their buttons render.
      Each entry is one of desktop, tablet or mobile, and the list must not be
      empty. A repeated entry is dropped with a warning. When device names a
      view that is not offered, the first offered view becomes the default
      view instead.
    options:
      values:
        - desktop
        - tablet
        - mobile
  controls:
    type: bool
    optional: true
    default: true
    comment: >-
      Flag indicating if the device switcher renders. Without it, the block
      shows the largest offered device that fits the viewport, or the smallest
      offered device when none fits, and swaps views when the viewport crosses
      a device breakpoint.
  activation:
    type: select
    optional: true
    default: load
    comment: >-
      When the live view loads. With load, the shown view loads with the
      page. With click, every view shows its poster with a button over it, and
      no view loads until the button is pressed; after that, a view loads when
      it is first shown. A block that shows its fallback shows no poster.
    options:
      values:
        - load
        - click
  poster:
    type: map[string]interface {}
    optional: true
    comment: >-
      Poster image per device view, shown until the preview is activated when
      activation is click, except on a block that shows its fallback. The keys
      are desktop, tablet and mobile. A view without a poster of its own uses
      the desktop poster, or a plain background when there is none. The mode
      argument applies to posters too.
example: |
  heading:
    title: Live Preview
  url: https://demo.gethinode.com
  device: desktop
