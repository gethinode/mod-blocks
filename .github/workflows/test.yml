name: Test
on:
  workflow_dispatch:
  push:
    tags:
      - v*
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    uses: gethinode/.github/.github/workflows/test.yml@v1
    with:
      package-manager: pnpm
      # Hugo differs per OS, so all three stay; Node versions have not mattered.
      node-matrix: '["lts/*"]'
    secrets: inherit
