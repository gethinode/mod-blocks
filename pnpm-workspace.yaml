# pnpm reads this for repo-wide settings even without sub-packages.
# allowBuilds is the v11 gate for which deps may run install scripts. Keep tight.
allowBuilds:
  esbuild: false # pulled in by @bookshop/hugo-engine; the template check needs no bundler
  hugo-extended: true # downloads the platform-specific Hugo binary
  # add more only when a postinstall failure is investigated and trusted
minimumReleaseAgeExclude:
  - "@gethinode/*"

# Remove once hugo-extended adopts the ZIP extraction security fixes.
overrides:
  adm-zip: "^0.6.1"
  # Bookshop pins an affected LiquidJS release and an older esbuild minor.
  # Scope the compiler replacement to the Hugo engine; its config API is compatible.
  liquidjs@10: "^10.27.2"
  "@bookshop/hugo-engine>esbuild": "^0.28.2"
